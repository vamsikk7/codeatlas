# Contributor License Agreement gate.
#
# Every pull request from a contributor who has not signed the CLA gets a
# comment from the bot with a link. Signing is one click and is recorded in a
# signatures file in a SEPARATE private repository — never in this one, because
# the signature record contains contributor names and emails.
#
# Setup required before this workflow does anything (see PUBLISH-RUNBOOK.md):
#   1. Create a private repo, e.g. vamsikk7/codeatlas-cla-signatures
#   2. Create a PAT with `repo` scope on that repository
#   3. Add it to this repository's secrets as PERSONAL_ACCESS_TOKEN
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Run on PR events, and on comments that are the signature phrase.
    if: |
      (github.event.issue.pull_request
        && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    steps:
      - name: CLA Assistant
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token for the private signatures repository.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/vamsikk7/codeatlas/blob/main/.github/CLA.md'
          branch: 'main'
          # Private repository — contributor names and emails must not be public.
          remote-organization-name: 'vamsikk7'
          remote-repository-name: 'codeatlas-cla-signatures'
          allowlist: 'vamsikk7,dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: |
            Thanks for the pull request.

            Before it can be merged, please sign the
            [Contributor License Agreement](https://github.com/vamsikk7/codeatlas/blob/main/.github/CLA.md).
            It takes one click and covers all your future contributions.

            **Worth reading section 3 before you sign** — it grants the right to
            relicense contributions commercially. The reasoning is in
            [COMMERCIAL.md](https://github.com/vamsikk7/codeatlas/blob/main/COMMERCIAL.md).

            If you are contributing on behalf of an employer, the
            [Corporate CLA](https://github.com/vamsikk7/codeatlas/blob/main/.github/CLA-CORPORATE.md)
            may apply instead.

            To sign, comment below with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
          lock-pullrequest-aftermerge: false
