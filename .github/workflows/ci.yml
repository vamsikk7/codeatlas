name: CI

on:
  pull_request:
    branches: [main, integration/*]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd webview-ui && npm ci

      - name: TypeScript type-check (extension host)
        run: npm run lint 2>&1 | grep -v "@babel/traverse" | grep "error TS" && exit 1 || true

      - name: TypeScript type-check (webview)
        run: cd webview-ui && npx tsc --noEmit

      - name: Build extension
        run: npm run compile

      - name: Build webview
        run: cd webview-ui && npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high || true
