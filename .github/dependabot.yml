# Dependency updates across all three npm trees plus GitHub Actions.
#
# Grouped by risk: production dependencies are reviewed individually, dev
# dependencies arrive as one weekly batch so the PR queue stays readable.
version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]

  - package-ecosystem: npm
    directory: '/webview-ui'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, webview]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: '/mcp-package'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, mcp]

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    labels: [dependencies, ci]
